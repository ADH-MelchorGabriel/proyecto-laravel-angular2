
services:
  # Servicio Angular (desarrollo)
  angular:
    build: ./Angular
    ports:
      - "4200:4200"
    volumes:
      - ./Angular:/app
      - /app/node_modules   # evita sobrescribir node_modules del contenedor
    stdin_open: true
    tty: true

  # Servicio PHP (Laravel)
  php:
    build: ./Laravel
    volumes:
      - ./Laravel:/var/www/html
    expose:
      - "9000"

  # Servidor web Nginx para Laravel
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./Laravel:/var/www/html
      - ./Laravel/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # Base de datos MySQL
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: